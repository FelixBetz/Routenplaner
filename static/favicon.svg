<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#166534"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="url(#bg)"/>

  <!-- Bicycle -->
  <!-- Rear wheel -->
  <circle cx="20" cy="38" r="10" fill="none" stroke="white" stroke-width="2.5"/>
  <circle cx="20" cy="38" r="2" fill="white"/>
  <!-- Front wheel -->
  <circle cx="44" cy="38" r="10" fill="none" stroke="white" stroke-width="2.5"/>
  <circle cx="44" cy="38" r="2" fill="white"/>

  <!-- Frame: chainstay (rear axle to bottom bracket) -->
  <line x1="20" y1="38" x2="32" y2="28" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Frame: seat tube + top tube -->
  <line x1="32" y1="28" x2="29" y2="20" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Frame: down tube (head tube to bottom bracket) -->
  <line x1="32" y1="28" x2="44" y2="38" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Frame: fork (head tube to front axle) -->
  <line x1="38" y1="22" x2="44" y2="38" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Frame: top tube -->
  <line x1="29" y1="20" x2="38" y2="22" stroke="white" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Handlebar -->
  <line x1="36" y1="20" x2="41" y2="20" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Saddle -->
  <line x1="26" y1="19" x2="32" y2="19" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
</svg>
